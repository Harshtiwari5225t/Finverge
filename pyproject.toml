[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finverge_ai"
version = "0.1.0"
description = "FinVerge AI portfolio, sentiment, and risk dashboard"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    {name = "Victor Jotham Ashioya", email = "ashioyajotham@icloud.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11"
]
dependencies = [
    # Dependencies will be read from requirements.txt
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "mypy",
    "flake8",
    "pytest-asyncio"
]

[project.scripts]
fingpt-trade = "scripts.live_trade:main"
fingpt-backtest = "scripts.backtest:main"
fingpt-analyze = "scripts.analyze:main"
app = "api.main:app"

[tool.vercel.scripts]
build = "python build.py"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
py_version = 311

[tool.bandit]
exclude_dirs = ["tests", "venv", ".git", "__pycache__"]
skips = ["B101", "B104"]  # Skip assert statements and hardcoded bind
targets = ["fingpt_trader"]

[tool.bandit.assert_used]
skips = ["test_*.py"]

[tool.bandit.hardcoded_bind_all_interfaces]
skips = ["start_bot.py"]
